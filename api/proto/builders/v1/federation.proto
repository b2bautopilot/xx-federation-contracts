// Organization is the product-facing view of an organization-registry record
// (P3 / 120C.2). Registry-confidential fields (tax_id, registered_address) and
// internal relay scoping (allowed fabrics/regions) are intentionally omitted.
message Organization {
  string tenant_id = 1;
  string org_id = 2;
  string org_handle = 3;
  string legal_name = 4;
  string primary_domain = 5;
  string support_email = 6;
  string security_contact_email = 7;
  string status = 8;
  string default_intake_posture = 9;
  string visibility_policy = 10;
  string created_by = 11;
  int64 created_at_ms = 12;
  int64 updated_at_ms = 13;
}

message RegisterOrganizationRequest {
  string tenant_id = 1;
  string org_handle = 2;
  string legal_name = 3;
  string primary_domain = 4;
  string support_email = 5;
  string security_contact_email = 6;
  string status = 7;
  string idempotency_key = 8;
}

message RegisterOrganizationResponse {
  Organization organization = 1;
  ErrorInfo error = 2;
}

message SetOrganizationStatusRequest {
  string tenant_id = 1;
  string org_handle = 2;
  // event is an orgregistry lifecycle transition: "revoke", "suspend", or
  // "flag_for_review". Applied fail-closed — only lawful transitions are permitted.
  string event = 3;
  string reason = 4;
}

message SetOrganizationStatusResponse {
  Organization organization = 1;
  // released_domains lists the verified domains released back to the pool when the
  // org moved to a suspended/revoked status (empty otherwise).
  repeated string released_domains = 2;
  ErrorInfo error = 3;
}

// DomainVerificationChallenge is the proof-of-control instruction returned to an
// org: publish expected_dns_txt_record at the domain, then call VerifyDomain.
message DomainVerificationChallenge {
  string domain = 1;
  string method = 2;
  string expected_dns_txt_record = 3;
  int64 issued_at_ms = 4;
  int64 expires_at_ms = 5;
  string org_status = 6;
}

message RequestDomainVerificationRequest {
  string tenant_id = 1;
  string org_handle = 2;
  string domain = 3;
  string method = 4;
}

message RequestDomainVerificationResponse {
  DomainVerificationChallenge challenge = 1;
  ErrorInfo error = 2;
}

message VerifyDomainRequest {
  string tenant_id = 1;
  string org_handle = 2;
  string domain = 3;
}

message VerifyDomainResponse {
  Organization organization = 1;
  bool verified = 2;
  string detail = 3;
  ErrorInfo error = 4;
}

message ResolveRecipientDomainRequest {
  string tenant_id = 1;
  string caller_org_handle = 2;
  string recipient_domain = 3;
}

// ResolveRecipientDomainResponse carries ONLY safe public signals. outcome is one
// of: resolved | recipient_unknown | recipient_suspended_or_revoked |
// domain_conflict_review_hold | recipient_verified_no_live_gateway |
// receiver_onboarding_required. eligible == (outcome == resolved) and is NOT an
// invoke permission. org_handle/status/trust_tier are populated only when a known
// org owns the domain.
message ResolveRecipientDomainResponse {
  string outcome = 1;
  bool eligible = 2;
  string org_handle = 3;
  string status = 4;
  string trust_tier = 5;
  ErrorInfo error = 6;
}

message DeriveOutboundPartnerLinkRequest {
  string tenant_id = 1;
  string caller_org_handle = 2;
  string recipient_domain = 3;
}

// DeriveOutboundPartnerLinkResponse: outcome is the same recipient-directory
// outcome as ResolveRecipientDomain. partner_link_id is the derived sender-local
// outbound link to the recipient, populated ONLY when outcome == resolved.
message DeriveOutboundPartnerLinkResponse {
  string outcome = 1;
