  int64 server_time_ms = 2;
}

// --- Portal direct-SQL replacement messages (S1) ----------------------------
// docs/design/portal-sql-to-rpc-inventory.md S4.2.

message GetDispatchStatusRequest {
  // tenant_id is explicit and mandatory: the control plane authorizes
  // (principal.OperatorID, tenant_id) against operator_project_memberships
  // BEFORE any read, then sets `app.tenant_id` for RLS (S3.1).
  string tenant_id = 1;
  // max_timestamp_ms is the precomputed upper timestamp boundary supplied by
  // the caller so a legacy-SQL/gRPC shadow comparison reads the same bounded
  // range (S6.2). 0 means "now" (server-evaluated at transaction start).
  int64 max_timestamp_ms = 2;
  // identifier selects the dispatch to report on. Exactly one must be set; an
  // unset oneof is rejected with control.invalid_argument. Field numbers 3 and
  // 4 are reserved to this oneof — a later third selector MUST take a new
  // number inside the same oneof, never reuse 3 or 4.
  oneof identifier {
    string transaction_id = 3;
    string exchange_request_id = 4;
  }
}

message GetDispatchStatusResponse {
  string status = 1;
  int64 duration_ms = 2;
  string result_payload_json = 3;
  repeated string fault_codes = 4;
  double p50_latency_ms = 5;
  double p95_latency_ms = 6;
  // watermark_unix_ms is the REPEATABLE READ snapshot timestamp (S6.1).
  int64 watermark_unix_ms = 7;
  ErrorInfo error = 8;
}

message GetMeshHealthRequest {
  // tenant_id is explicit and mandatory (S3.1).
  string tenant_id = 1;
  // max_timestamp_ms is the precomputed upper timestamp boundary (S6.2).
  // 0 means "now".
  int64 max_timestamp_ms = 2;
}

message GetMeshHealthResponse {
  repeated GatewayHealth gateways = 1;
  repeated MembershipExchangeStatus membership_exchanges = 2;
  // watermark_unix_ms is the REPEATABLE READ snapshot timestamp (S6.1).
  int64 watermark_unix_ms = 3;
  ErrorInfo error = 4;
}

message GatewayHealth {
  string gateway_id = 1;
  string spiffe_id = 2;
  string status = 3;
  int64 cert_expires_at_unix_ms = 4;
  // cert_expired is evaluated by the server against the same snapshot
  // watermark, so a client never has to re-derive expiry from a local clock.
  bool cert_expired = 5;
}

message MembershipExchangeStatus {
  string peer_domain = 1;
  string exchange_state = 2;
  int64 last_exchange_unix_ms = 3;
}

message GetBuilderFleetHealthRequest {
  // tenant_id is explicit and mandatory (S3.1).
  string tenant_id = 1;
  // max_timestamp_ms is the precomputed upper timestamp boundary (S6.2).
  // 0 means "now".
  int64 max_timestamp_ms = 2;
}

message GetBuilderFleetHealthResponse {
  repeated BuilderDaemonStatus daemons = 1;
  // watermark_unix_ms is the REPEATABLE READ snapshot timestamp (S6.1).
  int64 watermark_unix_ms = 2;
  ErrorInfo error = 3;
}

message BuilderDaemonStatus {
  string daemon_id = 1;
  string hostname = 2;
  int64 last_heartbeat_unix_ms = 3;
  // healthy is evaluated by the server against the same snapshot watermark.
  bool healthy = 4;
  int32 active_workloads = 5;
  int64 memory_rss_bytes = 6;
}

message InspectStuckItemsRequest {
  // tenant_id is explicit and mandatory (S3.1).
  string tenant_id = 1;
  // max_age_ms is the staleness threshold above which an item counts as stuck.
  int64 max_age_ms = 2;
  // max_timestamp_ms is the precomputed upper timestamp boundary (S6.2).
  // 0 means "now".
  int64 max_timestamp_ms = 3;
}

message InspectStuckItemsResponse {
  int32 stuck_exchanges_count = 1;
  int32 stuck_commercial_events_count = 2;
  int32 recent_fault_count = 3;
  string worst_case_fault_code = 4;
  // watermark_unix_ms is the REPEATABLE READ snapshot timestamp (S6.1), so all
  // four counters above come from one atomic point-in-time snapshot rather
  // than the four un-synced autocommit queries they replace.
  int64 watermark_unix_ms = 5;
  ErrorInfo error = 6;
}
