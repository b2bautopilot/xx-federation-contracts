// ===== FED-P16-008: outbound federation initiation =====

// OutboundExchangeRequestView is the wire projection of a control-plane outbound
// exchange record returned to the gateway worker by the Claim bridge RPC. It
// carries everything the store-less worker needs to build + send the envelope:
// the minted envelope_id/idempotency_key, the resolved-or-cached contract ref,
// the payload, and the namespace split (partner_link_id local vs
// remote_partner_link_id on the wire).
message OutboundExchangeRequestView {
  string tenant_id = 1;
  string request_id = 2;
  string partner_link_id = 3;
  string remote_partner_link_id = 4;
  string action = 5;
  string state = 6;
  string envelope_id = 7;
  string idempotency_key = 8;
  string correlation_id = 9;
  string contract_id = 10;
  string contract_version = 11;
  string manifest_hash_sha256 = 12;
  string payload_schema_hash_sha256 = 13;
  string payload_json = 14;
  string metadata_json = 15;
  string response_decision = 16;
  string response_denial_code = 17;
  string response_payload_json = 18;
  string authenticated_remote_gateway_id = 19;
  string failure_class = 20;
  string failure_reason = 21;
  int64 created_at_ms = 22;
  int64 updated_at_ms = 23;
  int64 claimed_at_ms = 24;
  int64 responded_at_ms = 25;
}

// CreateOutboundExchangeRequestRequest exposes ONLY the operator-supplied fields.
// Structurally NO Source/Destination/SPIFFE/pin/contract/envelope_id/wire-
// idempotency fields exist here (no-fabricated-identity). create_idempotency_key
// is control-side dedup only and NEVER goes on the wire.
message CreateOutboundExchangeRequestRequest {
  string tenant_id = 1;
  string partner_link_id = 2;
  string remote_partner_link_id = 3;
  string action = 4;
  string payload_json = 5;
  string metadata_json = 6;
  string create_idempotency_key = 7;
  // recipient_domain addresses the recipient BY DOMAIN instead of
  // remote_partner_link_id; the control plane resolves it via the member-
  // authenticated recipient directory. Provide exactly one of the two.
  string recipient_domain = 8;
  // large_attachments carries out-of-band attachment BYTES for the large-attachment
  // fed-svc path (design large-attachments-fedsvc.md). They travel on THIS local
  // portal->control gRPC only — NEVER the exchange wire; the control stores + per-dispatch
  // stages each blob and injects an opaque ref (fedsvc_ns + dispatch_token, no bytes) into
  // payload_json.task.attachments. Small attachments still ride payload_json b64 inline.
  repeated OutboundLargeAttachment large_attachments = 9;
}

// OutboundLargeAttachment is one large attachment blob uploaded alongside an outbound
// exchange request, to be staged + served out-of-band over fed-svc rather than inlined.
message OutboundLargeAttachment {
  string file_name = 1;
  string mime_type = 2;
  string sha256 = 3;   // client-declared; the control re-hashes and rejects a mismatch
  bytes content = 4;
}

message CreateOutboundExchangeRequestResponse {
  OutboundExchangeRequestView request = 1;
  ErrorInfo error = 2;
}

message UploadOutboundAttachmentChunkRequest {
  string tenant_id = 1;
  string sha256 = 2;      // content-address of the FULL reassembled blob
  int32 chunk_index = 3;
  int32 chunk_count = 4;
  bytes content = 5;      // this chunk's raw bytes; keep each call well under the ~128 KiB cap
}

message UploadOutboundAttachmentChunkResponse {
  bool complete = 1;      // true once all chunks are present + the blob is reassembled + stored
  ErrorInfo error = 2;
}

message ClaimPendingOutboundExchangeRequestsRequest {
  string tenant_id = 1;
  // partner_link_id is A's LOCAL link id (authorized like GatewayHeartbeat
  // against the gateway's allowed links). The returned view carries
  // remote_partner_link_id for the worker's dial/wire/manifest resolution.
  string partner_link_id = 2;
  int32 limit = 3;
}

message ClaimPendingOutboundExchangeRequestsResponse {
  repeated OutboundExchangeRequestView requests = 1;
  int64 server_time_ms = 2;
  ErrorInfo error = 3;
}

message RecordOutboundExchangeResultRequest {
