  string state = 4;
  string response_decision = 5;
  string response_denial_code = 6;
  string response_payload_json = 7;
  string authenticated_remote_gateway_id = 8;
  string failure_class = 9;
  string failure_reason = 10;
  string responder_signature = 11;
  string responder_signing_key_id = 12;
}

message RecordOutboundExchangeResultResponse {
  OutboundExchangeRequestView request = 1;
  ErrorInfo error = 2;
}

message WatchPendingOutboundExchangeRequestsRequest {
