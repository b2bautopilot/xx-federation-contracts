syntax = "proto3";

package builders.v1;

option go_package = "github.com/b2bautopilot/xyz-b2b/services/builders-net/gen/builders/v1;buildersv1";

import "builders/v1/common.proto";

service FederationAdminService {
  rpc CreatePartner(CreatePartnerRequest) returns (CreatePartnerResponse);
  rpc GetPartner(GetPartnerRequest) returns (GetPartnerResponse);
  rpc ListPartners(ListPartnersRequest) returns (ListPartnersResponse);
  // RegisterOrganization upserts the calling control's own organization-registry
  // record (P3 / 120C.2 self-service onboarding). Operator-gated: the org's own
  // control is the gate. Frictionless input — only tenant_id + org_handle are
  // required; relay fabric/region are control-defaulted, never client-supplied.
  rpc RegisterOrganization(RegisterOrganizationRequest) returns (RegisterOrganizationResponse);
  // RequestDomainVerification mints a proof-of-control challenge for an org's
  // domain (P3 / 120C.2 slice 2) and advances org_draft -> domain_pending. The
  // response carries the DNS TXT value the org must publish.
  rpc RequestDomainVerification(RequestDomainVerificationRequest) returns (RequestDomainVerificationResponse);
  // VerifyDomain checks the published proof (server-side DNS TXT lookup, never a
  // client-asserted value) and advances domain_pending -> domain_verified.
  rpc VerifyDomain(VerifyDomainRequest) returns (VerifyDomainResponse);
  // SetOrganizationStatus applies a lifecycle transition (revoke / suspend /
  // flag_for_review) to an org, operator-gated and fail-closed. On a transition to a
  // suspended/revoked status it releases the org's verified domains back to the pool
  // so another org can claim them.
  rpc SetOrganizationStatus(SetOrganizationStatusRequest) returns (SetOrganizationStatusResponse);
  // ResolveRecipientDomain is the member-authenticated recipient directory
  // (P3 / 120C.2 slice 3): a sending member resolves a recipient domain to the
  // owning org's eligibility outcome, from the stored registry + gateway presence.
  // It returns ONLY safe public signals (outcome, org handle, status, trust tier)
  // and is never an invoke permission — the receiver's control still owns intake.
  rpc ResolveRecipientDomain(ResolveRecipientDomainRequest) returns (ResolveRecipientDomainResponse);
  // DeriveOutboundPartnerLink (P3 / 120C.2 slice 4 — the crux): a sending member
  // resolves a recipient domain and gets a ready-to-use sender-local outbound
  // partner-link to it, derived (find-or-create) automatically — no operator
  // config. The link's trust is the shared federation relay-client CA (no
  // per-partner trust root). Returns the partner_link_id only on a resolved recipient.
  rpc DeriveOutboundPartnerLink(DeriveOutboundPartnerLinkRequest) returns (DeriveOutboundPartnerLinkResponse);
  // ResolvePartnerIdentity (2B): the READ side of partner identity. Assembles the
  // single authoritative "who is my partner + verified identity" record for a
  // (gateway, partner_link) from source-of-truth rows — the caller gateway, the
  // partner link, and the currently ADMISSIBLE pinned identities (active + fresh +
  // trust-root-bundle-consistent bindings). It uses the SAME exported usability
  // predicates the runtime authorization uses, so it reports exactly what the
  // denial layer would honor. It REPORTS state (it does not deny) — config
  // generation (2C) and operators consume it instead of hand-reading five tables.
  rpc ResolvePartnerIdentity(ResolvePartnerIdentityRequest) returns (ResolvePartnerIdentityResponse);
  // GenerateGatewayConfig (2C): DERIVE a gateway's per-partner federation runtime
  // config from authoritative store state (it composes ResolvePartnerIdentity over
  // the gateway's allowed partner links). Increment 1 produces the INBOUND
  // cert->binding authority (partner-link bindings) as the exact JSON document the
  // gateway loads; outbound relay-targets is a follow-on. Returned as an opaque-JSON
  // envelope (like the redeem bundle) so it is drop-in for the gateway's loaders.
  rpc GenerateGatewayConfig(GenerateGatewayConfigRequest) returns (GenerateGatewayConfigResponse);
  rpc UpsertServiceCatalogEntry(UpsertServiceCatalogEntryRequest) returns (UpsertServiceCatalogEntryResponse);
  rpc ListServiceCatalogEntries(ListServiceCatalogEntriesRequest) returns (ListServiceCatalogEntriesResponse);
  rpc RetireServiceCatalogEntry(RetireServiceCatalogEntryRequest) returns (RetireServiceCatalogEntryResponse);
  rpc UpsertFederationPolicyGrant(UpsertFederationPolicyGrantRequest) returns (UpsertFederationPolicyGrantResponse);
  rpc ListFederationPolicyGrants(ListFederationPolicyGrantsRequest) returns (ListFederationPolicyGrantsResponse);
  rpc ApproveFederationPolicyGrant(ApproveFederationPolicyGrantRequest) returns (ApproveFederationPolicyGrantResponse);
  rpc RevokeFederationPolicyGrant(RevokeFederationPolicyGrantRequest) returns (RevokeFederationPolicyGrantResponse);
  rpc CreatePartnerLink(CreatePartnerLinkRequest) returns (CreatePartnerLinkResponse);
  rpc GetPartnerLink(GetPartnerLinkRequest) returns (GetPartnerLinkResponse);
  rpc ListPartnerLinks(ListPartnerLinksRequest) returns (ListPartnerLinksResponse);
  rpc RevokePartnerLink(RevokePartnerLinkRequest) returns (RevokePartnerLinkResponse);
  rpc UpsertPartnerTrustRoot(UpsertPartnerTrustRootRequest) returns (UpsertPartnerTrustRootResponse);
  rpc ListPartnerTrustRoots(ListPartnerTrustRootsRequest) returns (ListPartnerTrustRootsResponse);
  rpc RevokePartnerTrustRoot(RevokePartnerTrustRootRequest) returns (RevokePartnerTrustRootResponse);
  rpc UpsertPartnerGatewayIdentityBinding(UpsertPartnerGatewayIdentityBindingRequest) returns (UpsertPartnerGatewayIdentityBindingResponse);
  rpc ListPartnerGatewayIdentityBindings(ListPartnerGatewayIdentityBindingsRequest) returns (ListPartnerGatewayIdentityBindingsResponse);
  rpc RevokePartnerGatewayIdentityBinding(RevokePartnerGatewayIdentityBindingRequest) returns (RevokePartnerGatewayIdentityBindingResponse);
  rpc UpsertGatewayPool(UpsertGatewayPoolRequest) returns (UpsertGatewayPoolResponse);
  rpc ListGatewayPools(ListGatewayPoolsRequest) returns (ListGatewayPoolsResponse);
  rpc RegisterFederationGateway(RegisterFederationGatewayRequest) returns (RegisterFederationGatewayResponse);
  rpc ListFederationGateways(ListFederationGatewaysRequest) returns (ListFederationGatewaysResponse);
  rpc CreateGatewayCredential(CreateGatewayCredentialRequest) returns (CreateGatewayCredentialResponse);
  rpc ListGatewayCredentials(ListGatewayCredentialsRequest) returns (ListGatewayCredentialsResponse);
  rpc RevokeGatewayCredential(RevokeGatewayCredentialRequest) returns (RevokeGatewayCredentialResponse);
  rpc ListFederationTransactions(ListFederationTransactionsRequest) returns (ListFederationTransactionsResponse);
  rpc ListGatewayExchangeDiagnostics(ListGatewayExchangeDiagnosticsRequest) returns (ListGatewayExchangeDiagnosticsResponse);
  rpc ApproveContractPack(ApproveContractPackRequest) returns (ApproveContractPackResponse);
  rpc ListContractPackApprovals(ListContractPackApprovalsRequest) returns (ListContractPackApprovalsResponse);
  rpc PinContractPackVersion(PinContractPackVersionRequest) returns (PinContractPackVersionResponse);
  rpc ListContractPackPins(ListContractPackPinsRequest) returns (ListContractPackPinsResponse);
  // CreateOutboundExchangeRequest records an operator-initiated outbound
  // federation exchange (FED-P16-008). Operator-scoped + audited. The request
  // exposes NO identity/contract/envelope fields: envelope_id + wire
  // idempotency_key are server-minted; the Source identity comes from the gateway
  // config at send time, never the request body.
  rpc CreateOutboundExchangeRequest(CreateOutboundExchangeRequestRequest) returns (CreateOutboundExchangeRequestResponse);
  // UploadOutboundAttachmentChunk uploads ONE chunk of a large attachment to the control's
  // content store ahead of the dispatch, so a blob bigger than a single portal->control gRPC
  // call (bounded by the ~128 KiB circuit-relay limited-connection data cap) can be delivered
  // across many small idempotent calls. Once all chunk_count chunks for sha256 are present the
  // control reassembles + policy-screens + stores the blob; the dispatch then references it by
  // sha256 (an OutboundLargeAttachment with sha256 set and content empty).
  rpc UploadOutboundAttachmentChunk(UploadOutboundAttachmentChunkRequest) returns (UploadOutboundAttachmentChunkResponse);

  // --- Portal direct-SQL replacement reads (S1) -----------------------------
  // docs/design/portal-sql-to-rpc-inventory.md S4.2. All four are read-only,
  // explicitly tenant-scoped, carry a precomputed `max_timestamp_ms` upper
  // boundary, and return the REPEATABLE READ transaction snapshot timestamp as
  // `watermark_unix_ms` (S6.1). Handlers land in S2; this slice is contract only.

  // GetDispatchStatus queries status, faults, and round-trip latencies for
  // outbound builder-work exchanges. Replaces inventory sites #2, #3, #4, #5,
  // #27 and #32.
  rpc GetDispatchStatus(GetDispatchStatusRequest) returns (GetDispatchStatusResponse);

  // GetMeshHealth inspects gateway enrollment, SPIFFE IDs, certificate expiry,
  // and peer membership exchanges. Replaces inventory sites #24, #25 and #26.
  rpc GetMeshHealth(GetMeshHealthRequest) returns (GetMeshHealthResponse);

  // GetBuilderFleetHealth queries builder daemon capacities, memory
  // utilization, and active heartbeats. Replaces inventory sites #1, #17
  // and #30.
  rpc GetBuilderFleetHealth(GetBuilderFleetHealthRequest) returns (GetBuilderFleetHealthResponse);

  // InspectStuckItems is a READ-ONLY inspection of stuck exchanges, stuck
  // commercial events, and recent builder faults. It never mutates: the
  // guarded cleanup mutations live behind MaintenanceAdminService.ExecuteOps
  // in admin.proto. Replaces inventory sites #19, #20, #21 and #22.
  rpc InspectStuckItems(InspectStuckItemsRequest) returns (InspectStuckItemsResponse);
}

service FederationService {
  rpc GatewayHeartbeat(GatewayHeartbeatRequest) returns (GatewayHeartbeatResponse);
  rpc GetServiceCatalogView(GetServiceCatalogViewRequest) returns (GetServiceCatalogViewResponse);
  rpc OpenFederationTransaction(OpenFederationTransactionRequest) returns (OpenFederationTransactionResponse);
  rpc CreateFederationRoom(CreateFederationRoomRequest) returns (CreateFederationRoomResponse);
  rpc SubmitFederationMessage(SubmitFederationMessageRequest) returns (SubmitFederationMessageResponse);
  rpc RequestBuilderWork(RequestBuilderWorkRequest) returns (RequestBuilderWorkResponse);
  rpc SubmitFederationResult(SubmitFederationResultRequest) returns (SubmitFederationResultResponse);
  // SubmitCommercialEvent is the typed O2C business-event intake (NE-4.1):
  // one RPC for all seven order_to_cash.v1 interactions. The ACTION comes
  // from the authenticated exchange envelope (contract-bound), never the
  // payload; the control plane validates the payload against the contract
  // pack's interaction schema and appends a typed commercial event
  // (idempotent by event key) with full allow/deny audit.
  rpc SubmitCommercialEvent(SubmitCommercialEventRequest) returns (SubmitCommercialEventResponse);
  // DeliverBuilderWorkResult is the REQUESTER-side reception of a partner's async
  // builder-work result (FED-P16-009 PR3, cross-org). Distinct from
  // SubmitFederationResult (executor-side): the requester keeps no transaction/
  // ledger for an outbound-initiated request, so it matches the result to its
  // outbound request row by the partner-minted work_request_id and records it there.
  rpc DeliverBuilderWorkResult(DeliverBuilderWorkResultRequest) returns (DeliverBuilderWorkResultResponse);
  // Bridge RPCs for the store-less outbound gateway worker (FED-P16-008), both
  // authorized by gateway credential like GatewayHeartbeat. Claim flips
  // claimable rows (pending OR lease-expired in_flight) to in_flight and returns
  // them; Record audits + persists every send outcome (allow/deny/fail).
  rpc ClaimPendingOutboundExchangeRequests(ClaimPendingOutboundExchangeRequestsRequest) returns (ClaimPendingOutboundExchangeRequestsResponse);
  rpc RecordOutboundExchangeResult(RecordOutboundExchangeResultRequest) returns (RecordOutboundExchangeResultResponse);
  // WatchPendingOutboundExchangeRequests streams a bare "a pending request now exists"
  // wake so the store-less outbound worker Claims immediately instead of waiting for its
  // next poll tick. Authorized PER LINK, exactly like ClaimPendingOutboundExchangeRequests
  // (never tenant-wide — that would leak wakes to other links in a shared tenant). The wake
  // carries NO request content: the worker responds by calling
  // ClaimPendingOutboundExchangeRequests, which remains the sole authoritative claim path.
  // Latency accelerator only — the worker's poll is the fail-safe floor if the stream drops
  // or a wake is missed.
  rpc WatchPendingOutboundExchangeRequests(WatchPendingOutboundExchangeRequestsRequest) returns (stream OutboundExchangePendingWake);
}

// GatewayRegistrationService carries the RM-2C gateway-registration command
// envelopes without expanding their JSON schema into protobuf fields. The
// JSON schema in internal/federation/gatewayregistration remains the authority
// for canonical bytes, idempotency digests, signatures, and response envelopes.
service GatewayRegistrationService {
  rpc CreateGatewayBootstrapIntent(GatewayRegistrationCommandRequest) returns (GatewayRegistrationCommandResponse);
  rpc RedeemGatewayBootstrapIntent(GatewayRegistrationCommandRequest) returns (GatewayRegistrationCommandResponse);
  rpc RevokeGatewayRelayIdentity(GatewayRegistrationCommandRequest) returns (GatewayRegistrationCommandResponse);
  rpc RotateGatewayRelayIdentity(GatewayRegistrationCommandRequest) returns (GatewayRegistrationCommandResponse);
  // IssueMembershipCapability mints the short-TTL, signed libp2p-fabric MEMBERSHIP
  // CAPABILITY (libp2p-fabric-migration P1.3) that binds an already-enrolled
  // gateway's SEPARATE libp2p host key to its authorized federation identity. The
  // caller proves possession of the libp2p private key (PoP over a request-bound
  // challenge); the JSON schema in federation-gateway/gatewayregistration is the
  // authority for the payload and the signed response envelope.
  rpc IssueMembershipCapability(GatewayRegistrationCommandRequest) returns (GatewayRegistrationCommandResponse);
  // PullMembershipRevocationList serves the caller's OWN-ORG signed libp2p-fabric
  // revocation list (libp2p-fabric-migration P1.4 transport, own-org-only). It is a
  // READ, dialed by the cert-renew-style reconciler over the control's :9090 (mTLS
  // for hardened controls) with the operator dev-identity + tenant — the same
  // operator+tenant auth as the other lifecycle commands. Per-partner cross-org
  // distribution is a later phase (D6).
  rpc PullMembershipRevocationList(GatewayRegistrationCommandRequest) returns (GatewayRegistrationCommandResponse);
  // RegisterMeshIdentity records a relay daemon's MESH ed25519 identity + WireGuard-path
  // material for an already-enrolled binding (control-plane peer-feed bridge G1), so the
  // control plane can assemble it into a signed FabricPeerRoster. The daemon proves
  // possession of the mesh key over an identity-bound challenge; the JSON schema in
  // federation-gateway/gatewayregistration is the authority for the payload. Dormant
  // (scope-only) until the migration grants gateway.identity.mesh_register.
  rpc RegisterMeshIdentity(GatewayRegistrationCommandRequest) returns (GatewayRegistrationCommandResponse);
  // PullFabricPeerRoster serves the caller's OWN-ORG signed FabricPeerRoster (peer-feed
  // bridge G2): the control plane lists the org's registered relay mesh identities,
  // re-verifies each, and assembles + membership-CA-signs a short-TTL roster the relay
  // daemon applies to state.Peers. A READ, dialed by the reconciler like the
  // revocation-list pull. Doubly dormant (nil signer + ungranted scope) until enabled.
  rpc PullFabricPeerRoster(GatewayRegistrationCommandRequest) returns (GatewayRegistrationCommandResponse);
}

