name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-spec:
    name: Validate Baylife XML Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libxml2-utils (xmllint)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate XML Specification
        run: python3 scripts/validate-spec.py

  test:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Go Build
        run: go build -v ./...
      - name: Go Vet
        run: go vet ./...
      - name: Go Test (-race)
        run: go test -v -race -count=1 ./...
